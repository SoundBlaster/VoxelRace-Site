# Adapted from SoundBlaster/Dreams-Site and 7of10; see THIRD_PARTY_NOTICES.md.
name: Deploy Voxel Race website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'website/voxelrace/**'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: read

concurrency:
  group: deploy-voxelrace-website
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: FTP
    env:
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_PORT: ${{ vars.FTP_PORT }}
      FTP_USER: ${{ vars.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_ROOT: ${{ vars.FTP_REMOTE_ROOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate deployment target
        run: |
          set -euo pipefail
          test "$FTP_HOST" = server209.hosting.reg.ru
          test "$FTP_PORT" = 21
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          test "$FTP_REMOTE_ROOT" = /www/egormerkushev.ru/voxelrace
          test -f website/voxelrace/index.html
          test -f website/voxelrace/support/index.html
          test -f website/voxelrace/privacy/index.html
      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Prepare verified certificate chain
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' \
            https://secure.globalsign.com/cacert/gsgccr6alphasslca2025.crt \
            --output "$RUNNER_TEMP/hosting-intermediate.der"
          openssl x509 -inform DER -in "$RUNNER_TEMP/hosting-intermediate.der" \
            -out "$RUNNER_TEMP/hosting-intermediate.pem"
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/hosting-intermediate.pem"
          cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/hosting-intermediate.pem" > "$RUNNER_TEMP/hosting-ca-bundle.pem"
      - name: Upload only the Voxel Race directory
        run: |
          set -euo pipefail
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USER" "ftp://$FTP_HOST:$FTP_PORT" <<EOF
          set cmd:fail-exit true
          set ssl:verify-certificate true
          set ssl:check-hostname true
          set ssl:ca-file "$RUNNER_TEMP/hosting-ca-bundle.pem"
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 2
          set net:timeout 30
          lcd "$GITHUB_WORKSPACE/website/voxelrace"
          mkdir -p "$FTP_REMOTE_ROOT"
          cd "$FTP_REMOTE_ROOT"
          mirror -R --verbose --exclude-glob .DS_Store . .
          bye
          EOF
      - name: Verify every published file
        run: |
          python3 - <<'PYVERIFY'
          from hashlib import sha256
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          root = Path('website/voxelrace')
          files = [p for p in root.rglob('*') if p.is_file() and p.name != '.DS_Store']
          for path in files:
              relative = path.relative_to(root).as_posix()
              with urlopen('https://egormerkushev.ru/voxelrace/' + quote(relative), timeout=30) as response:
                  published = response.read()
              if sha256(published).digest() != sha256(path.read_bytes()).digest():
                  raise SystemExit(f'Published content differs: {relative}')
          print(f'PASS: {len(files)} files match the deployment commit')
          PYVERIFY
